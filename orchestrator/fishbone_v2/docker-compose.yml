version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: fishbone_v2_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - fishbone_network

volumes:
  redis_data:
    driver: local

networks:
  fishbone_network:
    driver: bridge
